family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">G patient</text><circle cx="594.00" cy="183.00" r="6.00" fill="#0b1622"/><circle cx="594.00" cy="183.00" r="4.00" fill="#e8ecf0"></circle><line x1="594.00" y1="189.00" x2="594.00" y2="244.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="594.00" y="256.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8fa4b8" text-anchor="middle" font-weight="normal">joint target, in the overlap</text><text x="24.00" y="296.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a9bccd" text-anchor="start" font-weight="normal">Presents as uninformed deference.</text><text x="24.00" y="313.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a9bccd" text-anchor="start" font-weight="normal">Intervention: plain language, teach-back.</text><text x="254.00" y="296.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a9bccd" text-anchor="start" font-weight="normal">Presents as hesitation or refusal.</text><text x="254.00" y="313.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a9bccd" text-anchor="start" font-weight="normal">Intervention: elicit the patient's values.</text><text x="484.00" y="296.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a9bccd" text-anchor="start" font-weight="normal">Presents as talking past each other.</text><text x="484.00" y="313.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a9bccd" text-anchor="start" font-weight="normal">Intervention: negotiate the goal region.</text><text x="16.00" y="386.00" font-family="Inter, -a