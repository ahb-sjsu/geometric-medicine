<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Consent invariance score: an illustrative patient"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">Consent invariance score: an illustrative patient</text><text x="30.00" y="60.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">meaning-preserving transformation (Section 8.3.1)</text><text x="560.00" y="60.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">decision</text><line x1="30.00" y1="114.00" x2="690.00" y2="114.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="30.00" y="88.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">Positive or negative framing</text><text x="30.00" y="104.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a9bccd" text-anchor="start" font-weight="normal">“90% survive” or “10% die”</text><circle cx="566.00" cy="91.00" r="7.50" fill="#0b1622"/><circle cx="566.00" cy="91.00" r="5.50" fill="#a6d854"></circle><text x="580.00" y="95.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">stays the same</text><line x1="30.00" y1="160.00" x2="690.00" y2="160.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="30.00" y="134.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">Absolute numbers or relative risk</text><text x="30.00" y="150.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a9bccd" text-anchor="start" font-weight="normal">“2 in 100 have complications” or “the risk is doubled from 1% to 2%”</text><circle cx="566.00" cy="137.00" r="5.50" fill="#0b1622" stroke="#e78ac3" stroke-width="2.5"/><text x="580.00" y="141.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="600">changes</text><line x1="30.00" y1="206.00" x2="690.00" y2="206.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="30.00" y="180.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">Gains or losses</text><text x="30.00" y="196.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a9bccd" text-anchor="start" font-weight="normal">“you will gain 3 years of life” or “without treatment, you will lose 3 years”</text><circle cx="566.00" cy="183.00" r="7.50" fill="#0b1622"/><circle cx="566.00" cy="183.00" r="5.50" fill="#a6d854"></circle><text x="580.00" y="187.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">stays the same</text><line x1="30.00" y1="252.00" x2="690.00" y2="252.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="30.00" y="226.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">Natural frequencies or percentages</text><text x="30.00" y="242.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a9bccd" text-anchor="start" font-weight="normal">“2 out of 100 patients” or “2% of patients”</text><circle cx="566.00" cy="229.00" r="7.50" fill="#0b1622"/><circle cx="566.00" cy="229.00" r="5.50" fill="#a6d854"></circle><text x="580.00" y="233.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">stays the same</text><text x="136.00" y="316.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="end" font-weight="600">CIS</text><line x1="150.00" y1="312.00" x2="560.00" y2="312.00" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="150.00" y1="308.00" x2="150.00" y2="316.00" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="150.00" y="331.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">0</text><line x1="252.50" y1="308.00" x2="252.50" y2="316.00" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="252.50" y="331.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">0.25</text><line x1="355.00" y1="308.00" x2="355.00" y2="316.00" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="355.00" y="331.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">0.5</text><line x1="457.50" y1="308.00" x2="457.50" y2="316.00" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="457.50" y="331.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">0.75</text><line x1="560.00" y1="308.00" x2="560.00" y2="316.00" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="560.00" y="331.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">1</text><line x1="478.00" y1="290.00" x2="478.00" y2="320.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" stroke-opacity="1.0"/><text x="484.00" y="298.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal" font-style="italic">example threshold, CIS ≥ 0.8</text><circle cx="457.50" cy="312.00" r="7.50" fill="#0b1622"/><circle cx="457.50" cy="312.00" r="5.50" fill="#e8ecf0"><title>CIS 0.75</title></circle><text x="447.50" y="300.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="end" font-weight="normal">this patient: 3 of 4 = 0.75</text><text x="16.00" y="386.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">Illustrative responses, not data.</text></svg>